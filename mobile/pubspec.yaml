name: aroel
description: "Aroel — a quiet four-second journal that keeps a record of your days."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  dio: ^5.11.1 # Transport.
  drift: ^2.35.4 # The device's own store.
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0 # State (§7.1).
  flutter_secure_storage: ^11.2.0 # The keychain.
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0 # Models.
  go_router: ^18.1.4 # Navigation (§7.1).
  google_sign_in: ^7.2.0 # Identity providers (§5.1).
  intl: ^0.20.2
  json_annotation: ^4.12.0 # Models.
  material_ui: ^1.11.1 # Standalone Material package (default since Flutter 3.50).
  riverpod: ^3.5.0
  sign_in_with_apple: ^8.2.0 # Identity providers (§5.1).

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    # Newsreader carries the prose and the headings (§6.2).
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    # Inter carries the chrome only: labels, buttons, metadata.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
