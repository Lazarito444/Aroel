name: aroel
description: "Aroel — a quiet four-second journal that keeps a record of your days."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State, navigation and storage (§7.1).
  flutter_riverpod: ^3.5.0
  riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0

  # Models and transport.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.11.1

  # Identity providers (§5.1).
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0

  # Foundations.
  intl: ^0.20.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  # Pinned: drift_dev 2.34.6+ asks for analyzer 13, which freezed 3.x (the last line that
  # runs on Dart 3.12) cannot live with.
  drift_dev: 2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    # Newsreader carries the prose and the headings (§6.2).
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    # Inter carries the chrome only: labels, buttons, metadata.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
